# =============================================================================
#  contract-service - architecture policy. HUMAN-OWNED. Checked by gauntlet/archtest (ArchUnit).
#  Replaces gauntlet/config/architecture.properties for this module.
#  Written at install (2026-10-12) from the target layout in contract-service/CLAUDE.md, "Структура пакетов".
#  The skeleton has only `config` today; the other components are declared ahead so the steps that add them
#  need no policy change. A component that appears in the code without a line here fails the gate.
# =============================================================================

base.package=ru.projectx.contracts

# allowed.<component> = components it MAY depend on (comma-separated, empty = none).
# Components are the direct sub-packages of base.package; nested packages (service.inbox, service.outbox,
# service.reference, service.integration) belong to their parent. Anything not listed is a violation, and
# every component found in the code must be declared here.
#
# Layered service: controller -> service -> repository -> entity; dto, message and exception are shared value
# types. config holds bean factories and configuration records only and references no package of the module.
allowed.config=
allowed.entity=
allowed.exception=
allowed.message=
allowed.repository=entity
allowed.dto=entity
allowed.service=config,dto,entity,exception,message,repository
allowed.controller=dto,exception,service

# forbidden.<component> = outside packages it must not touch (ArchUnit package syntax).
# "Only service.integration knows AMQP" cannot be expressed per component (integration is inside service);
# the reviewer checks it.
forbidden.entity=org.springframework..,org.springframework.amqp..,com.rabbitmq..,tools.jackson..,jakarta.servlet..
forbidden.dto=jakarta.persistence..,org.hibernate..,org.springframework..
forbidden.message=jakarta.persistence..,org.hibernate..,org.springframework..,org.springframework.amqp..,com.rabbitmq..
forbidden.exception=org.springframework..,jakarta.persistence..
forbidden.repository=org.springframework.amqp..,com.rabbitmq..,org.springframework.web..,jakarta.servlet..
forbidden.config=org.springframework.amqp..,com.rabbitmq..
# Controllers read through the service layer only: never the message handling, the outbox or the brokers.
forbidden.controller=jakarta.persistence..,org.springframework.data..,org.springframework.amqp..,com.rabbitmq..,ru.projectx.contracts.service.inbox..,ru.projectx.contracts.service.outbox..,ru.projectx.contracts.service.integration..
forbidden.service=org.springframework.web..,jakarta.servlet..

# Fail on dependency cycles: between components and between any two packages under base.package.
# Strict from the first day: the module starts with no cycles and keeps it that way.
fail.on.cycles=true

# Martin's "distance from the main sequence" D = |A + I - 1| per component (0..1).
# Empty = report only.
max.distance=
