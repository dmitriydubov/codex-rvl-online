# =============================================================================
#  contract-service - module overlay of gauntlet/config/gauntlet.properties. HUMAN-OWNED.
#  Keys here win over the common file; module, baseRef, cucumber.version and thresholds stay there.
# =============================================================================

basePackage=ru.projectx.contracts

# Excluded from coverage, CRAP and mutation (class-name globs, owner's decision at install, 2026-10-12):
#   *Application           ContractServiceApplication (bootstrap)
#   *Config                config.ClockConfig, config.SchedulingConfig, service.integration.broker.BrokerConfig,
#                          service.integration.reference.ReferenceClientConfig,
#                          service.integration.storage.StorageClientConfig - @Bean factories only; the broker logic lives
#                          in BrokerConnectionFactories, BrokerTemplates, BrokerListenerContainerFactories and
#                          BrokerHealthIndicator, which stay under coverage and mutation
#   *Configuration         service.leadership.LeadershipConfiguration - @Bean factories of the leader lock registry and
#                          initiator; the pool copy lives in LeaderLockPool, which stays under coverage and mutation
#   *Repository            Spring Data interfaces in repository.* (no code of ours to mutate; QuarantineRepository holds a
#                          native batch update that erases bodies) and three JdbcClient repositories that only a real database
#                          exercises: repository.database.SessionSettingsRepository (pg_settings),
#                          repository.database.LeaderLockRepository (FOR SHARE on the leader row),
#                          repository.journal.InboxProbeRepository (inbox probe during the pause); mask kept by the
#                          coordinator 2026-10-27. Fragment implementations are NOT hidden: repository.IssuanceRepositoryLockingImpl
#                          (lock order and mode) stays under coverage and mutation (narrowed from *Repository*
#                          2026-10-26, owner's decision)
# NOT excluded on purpose: *Properties (configuration records may carry validation logic), message records,
# listeners, services, schedulers and the REST layer.
# Keep this comment listing exactly what the masks hide today; narrow a mask when a hidden class gains logic.
exclude.classes=*Application,*Config,*Configuration,*Repository

acceptance.glue=ru.projectx.contracts.acceptance

# Left out of the duplicate search (dry.exclude -> CPD --exclude): nothing today. JPA entities arrive with the
# first behaviour step; if CPD reports them as duplicates of each other (same field/getter structure by design,
# as in data-reference), the owner adds src/main/java/ru/projectx/contracts/entity here with the reason.
dry.exclude=
