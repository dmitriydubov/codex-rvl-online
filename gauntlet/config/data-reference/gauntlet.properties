# =============================================================================
#  data-reference - module overlay of gauntlet/config/gauntlet.properties. HUMAN-OWNED.
#  Keys here win over the common file; module, baseRef, cucumber.version and thresholds stay there.
# =============================================================================

basePackage=ru.projectx.datareference

# Excluded from coverage, CRAP and mutation (class-name globs, owner's decision at install, 2026-09-30):
#   *Application           DataReferenceApplication (bootstrap)
#   *Config                ClockConfig, JacksonConfig - @Bean factories only
#   *Configuration         none today; kept so a future @Configuration class is not mutated
#   *Repository*           Spring Data interfaces (JPQL/native SQL that only a real database exercises) and,
#                          since PR #25, two thin IO adapters: PolicySearchRepositoryImpl (Criteria API: R-04
#                          ranking, order, limit - PolicyApiTest, @IntegrationTest) and SessionSettingsRepository
#                          (JdbcClient over pg_settings - DatabaseTimeoutsTest); rule 8, coordinator by owner's
#                          delegation on PR #25, 2026-10-01
#   PolicySpecifications   JPA Criteria specifications - only a real database exercises them
# NOT excluded on purpose: *Properties (InboundRetryProperties and OneCContractProperties carry logic),
# the 1C stream mappers in mapper/ (parsing rules), listeners, services and schedulers.
# Keep this comment listing exactly what the masks hide today; narrow a mask when a hidden class gains logic.
exclude.classes=*Application,*Config,*Configuration,*Repository*,*PolicySpecifications

acceptance.glue=ru.projectx.datareference.acceptance

# The unit test OpenApiContractTest checks docs/openapi.yaml against the controllers, so a change there must rerun
# `test` (owner's decision 2026-11-11). CI: data-reference/docs/openapi.yaml is listed at the end of `paths` in
# .github/workflows/gauntlet.yml.
test.inputs=docs/openapi.yaml

# Left out of the duplicate search (dry.exclude -> CPD --exclude; owner's decision Р1 (а), 2026-09-30):
#   entity/   JPA entities repeat the same field/getter/setter structure by design (GA-2); CPD reported
#             them as duplicates of each other. Duplicates between entities and other packages disappear too:
#             real duplicates outside entity/ (mappers, services) are still found and fixed in code.
dry.exclude=src/main/java/ru/projectx/datareference/entity
