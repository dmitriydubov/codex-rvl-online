# =============================================================================
#  data-reference - architecture policy. HUMAN-OWNED. Checked by gauntlet/archtest (ArchUnit).
#  Replaces gauntlet/config/architecture.properties for this module.
#  Written at install (2026-09-30) from the dependencies the code has today: the gate is green on
#  the current code, and every edge below is a fact, not a target. Tightening is the owner's decision,
#  one task per change.
# =============================================================================

base.package=ru.projectx.datareference

# allowed.<component> = components it MAY depend on (comma-separated, empty = none).
# Components are the direct sub-packages of base.package; nested packages (service.integration,
# service.onec, service.schedulers) belong to their parent. Anything not listed is a violation, and
# every component found in the code must be declared here.
#
# Layered service (contract-service/CLAUDE.md, "Структура пакетов", describes data-reference):
# controller -> service -> repository -> entity; the 1C stream mappers are called by service.onec;
# dto and exception are shared value types.
allowed.config=
allowed.entity=
allowed.repository=entity
allowed.dto=entity
allowed.exception=
allowed.mapper=config,entity,exception,repository
allowed.service=config,dto,entity,exception,mapper,repository
allowed.controller=dto,exception,service
#
# Edges against the direction, reported at install (owner decides, separate tasks):
#   mapper -> service     removed 2026-10-06 (Р8): Ш20 (PR #88) moved the 1C value-parsing rules
#                         (StreamMapper, ImportResult, OneCValues, OneCGuid, OneCMoneyScale, OneCRawParser,
#                         OneCRequiredValues) from service.onec to mapper; the mapper <-> service cycle is gone,
#                         service -> mapper is the declared direction.
#   dto -> repository     removed 2026-10-01 (Р8): Ш10 (PR #25) moved building the ICD-10 row into the service
#                         (dto.Mkb10Code); dto no longer depends on repository.
#   exception -> dto      removed 2026-10-04 (Р8): Ш8 (PR #40) made the exceptions carry plain identifiers
#                         (candidate kind and ids, lpu id); the error body is built by controller.AmbiguityDetails.

# forbidden.<component> = outside packages it must not touch (ArchUnit package syntax).
# Only rules that hold today. "Only service.integration knows AMQP" cannot be expressed per component
# (integration is inside service); the reviewer checks it.
forbidden.entity=org.springframework..,org.springframework.amqp..,com.rabbitmq..,tools.jackson..,jakarta.servlet..
forbidden.dto=jakarta.persistence..,org.hibernate..,org.springframework..
forbidden.exception=org.springframework..,jakarta.persistence..
forbidden.repository=org.springframework.amqp..,com.rabbitmq..,org.springframework.web..,jakarta.servlet..
forbidden.mapper=org.springframework.amqp..,com.rabbitmq..,org.springframework.web..,jakarta.servlet..
forbidden.config=org.springframework.amqp..,com.rabbitmq..
# Controllers read through the service layer only: they never reach the 1C ingest (service.integration,
# service.onec) or the scheduled jobs (service.schedulers) - owner decision 2026-10-07.
forbidden.controller=jakarta.persistence..,org.springframework.data..,org.springframework.amqp..,com.rabbitmq..,ru.projectx.datareference.service.integration..,ru.projectx.datareference.service.onec..,ru.projectx.datareference.service.schedulers..
forbidden.service=org.springframework.web..,jakarta.servlet..

# Fail on dependency cycles: between components and, since 2026-10-06, between any two packages under
# base.package (service.onec <-> service.retention fails as well).
# false at install (mapper <-> service cycle); true since 2026-10-06, after Ш20 (PR #88) broke the cycle.
fail.on.cycles=true

# Martin's "distance from the main sequence" D = |A + I - 1| per component (0..1).
# Empty = report only.
max.distance=
