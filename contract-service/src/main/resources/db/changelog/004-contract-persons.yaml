databaseChangeLog:

  - changeSet:
      id: 004-contract-persons
      author: contract-service
      comment: >
        Стороны договора: снимок персональных данных участников из задачи сервиса Заявок. По договору
        КМ две записи (страхователь и застрахованный), по полису ЛМ одна (застрахованный). Запись
        принадлежит ровно одному из них.
      changes:
        - createTable:
            tableName: contract_persons
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, primaryKeyName: pk_contract_persons, nullable: false } }
              - column: { name: contract_id, type: uuid, constraints: { foreignKeyName: fk_contract_persons_contract, references: contracts(id) } }
              - column: { name: lm_policy_id, type: uuid, constraints: { foreignKeyName: fk_contract_persons_lm_policy, references: lm_policies(id) } }
              - column: { name: role, type: person_role, constraints: { nullable: false } }
              - column: { name: participant_id, type: uuid, constraints: { nullable: false } }
              - column: { name: last_name, type: varchar(100), constraints: { nullable: false } }
              - column: { name: first_name, type: varchar(100), constraints: { nullable: false } }
              - column: { name: middle_name, type: varchar(100) }
              - column: { name: birth_date, type: date, constraints: { nullable: false } }
              - column: { name: gender, type: gender, constraints: { nullable: false } }
              - column: { name: relation_type, type: varchar(50) }
              - column: { name: document_type, type: identity_doc_type, constraints: { nullable: false } }
              - column: { name: document_series, type: varchar(20) }
              - column: { name: document_number, type: varchar(20), constraints: { nullable: false } }
              - column: { name: document_issued_by, type: varchar(255) }
              - column: { name: document_issued_at, type: date }
              - column: { name: document_division_code, type: varchar(10) }
              - column: { name: address, type: text }
              - column: { name: snapshot_at, type: timestamptz, constraints: { nullable: false } }
              - column: { name: created_at, type: timestamptz, constraints: { nullable: false } }
        - sql:
            sql: >
              ALTER TABLE contract_persons ADD CONSTRAINT ck_contract_persons_owner
                CHECK ((contract_id IS NULL) <> (lm_policy_id IS NULL));
        - createIndex:
            tableName: contract_persons
            indexName: ix_contract_persons_contract_id
            columns:
              - column: { name: contract_id }
        - createIndex:
            tableName: contract_persons
            indexName: ix_contract_persons_lm_policy_id
            columns:
              - column: { name: lm_policy_id }
        - createIndex:
            tableName: contract_persons
            indexName: ix_contract_persons_participant_id
            columns:
              - column: { name: participant_id }
      rollback:
        - dropTable: { tableName: contract_persons }
