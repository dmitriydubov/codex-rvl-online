databaseChangeLog:

  - changeSet:
      id: 003-lm-policies
      author: contract-service
      comment: >
        Полисы ЛМ родственникам без доплаты по корпоративному договору страхователя. Причина и
        комментарий прекращения хранятся так же, как у договора КМ: по сообщению о прекращении работы
        полис прекращается с той же причиной. Программа страхования заполняется, когда появится
        правило её подбора. Уникальность участника действует среди незавершённых записей.
      changes:
        - createTable:
            tableName: lm_policies
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, primaryKeyName: pk_lm_policies, nullable: false } }
              - column: { name: status, type: lm_policy_status, constraints: { nullable: false } }
              - column: { name: individual_request_id, type: uuid, constraints: { nullable: false } }
              - column: { name: participant_id, type: uuid, constraints: { nullable: false } }
              - column: { name: policyholder_participant_id, type: uuid, constraints: { nullable: false } }
              - column: { name: insurance_contract_id, type: uuid, constraints: { nullable: false } }
              - column: { name: insurer_policy_id, type: uuid, constraints: { nullable: false } }
              - column: { name: program_id, type: uuid }
              - column: { name: date_from, type: date, constraints: { nullable: false } }
              - column: { name: date_to, type: date, constraints: { nullable: false } }
              - column: { name: issued_policy_id, type: uuid }
              - column: { name: issued_policy_number, type: varchar(50) }
              - column: { name: policy_usk_id, type: uuid }
              - column: { name: policy_usk_number, type: varchar(50) }
              - column: { name: error_code, type: varchar(50) }
              - column: { name: error_message, type: text }
              - column: { name: cancel_reason, type: contract_cancel_reason }
              - column: { name: cancel_comment, type: text }
              - column: { name: cancelled_at, type: timestamptz }
              - column: { name: entity_version, type: int, constraints: { nullable: false } }
              - column: { name: created_at, type: timestamptz, constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamptz, constraints: { nullable: false } }
        - createIndex:
            tableName: lm_policies
            indexName: ix_lm_policies_individual_request_id
            columns:
              - column: { name: individual_request_id }
        - createIndex:
            tableName: lm_policies
            indexName: ix_lm_policies_status
            columns:
              - column: { name: status }
        - createIndex:
            tableName: lm_policies
            indexName: ix_lm_policies_policy_usk_id
            columns:
              - column: { name: policy_usk_id }
        - sql:
            sql: >
              CREATE UNIQUE INDEX uq_lm_policies_active_participant ON lm_policies (participant_id)
                WHERE status NOT IN ('ISSUED', 'ERROR', 'CANCELLED');
      rollback:
        - dropTable: { tableName: lm_policies }
