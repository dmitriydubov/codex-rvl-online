spring:
  application:
    name: contract-service

  threads:
    virtual:
      enabled: true

  lifecycle:
    timeout-per-shutdown-phase: 30s

  task:
    scheduling:
      pool:
        size: 8

  jackson:
    property-naming-strategy: SNAKE_CASE

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
      file-size-threshold: 10MB

  autoconfigure:
    exclude:
      - org.springframework.boot.amqp.autoconfigure.RabbitAutoConfiguration

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/contract_service?logServerErrorDetail=false}
    username: ${DB_USERNAME:contract_service}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: application
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:2000}
      validation-timeout: 1000
      data-source-properties:
        options: >-
          -c lock_timeout=${projectx.database.session-timeouts.lock-timeout}
          -c statement_timeout=${projectx.database.session-timeouts.statement-timeout}
          -c idle_in_transaction_session_timeout=${projectx.database.session-timeouts.idle-in-transaction-session-timeout}
        socketTimeout: ${DB_SOCKET_TIMEOUT_SECONDS:60}
        logServerErrorDetail: false

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        type:
          json_format_mapper: ru.projectx.contracts.config.Jackson3JsonFormatMapper

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    url: ${spring.datasource.url}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
    analytics-enabled: false

server:
  shutdown: graceful
  tomcat:
    max-swallow-size: 20MB

logging:
  structured:
    format:
      console: ecs
  level:
    org.hibernate.orm.jdbc.error: "off"

management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - prometheus
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
      show-components: always
      show-details: always
  health:
    rabbit:
      enabled: false

projectx:
  brokers:
    internal:
      connection:
        host: ${RABBITMQ_INTERNAL_HOST:localhost}
        port: ${RABBITMQ_INTERNAL_PORT:5674}
        virtual-host: ${RABBITMQ_INTERNAL_VHOST:/}
        username: ${RABBITMQ_INTERNAL_USERNAME:contract_service}
        password: ${RABBITMQ_INTERNAL_PASSWORD:}
        connection-timeout: 10s
        tls:
          enabled: ${RABBITMQ_INTERNAL_SSL_ENABLED:false}
          validate-server-certificate: ${RABBITMQ_INTERNAL_SSL_VALIDATE_CERTIFICATE:true}
          verify-hostname: ${RABBITMQ_INTERNAL_SSL_VERIFY_HOSTNAME:true}
      listener-auto-startup: ${RABBITMQ_INTERNAL_LISTENER_AUTO_STARTUP:true}
      queues:
        task-changes: ${INTERNAL_QUEUE_TASK_CHANGES:rvl_requests_to_rvl_contracts_task-changes}
        status-changes: ${INTERNAL_QUEUE_STATUS_CHANGES:rvl_contracts_to_rvl_requests_status-changes}
    onec:
      connection:
        host: ${RABBITMQ_ONEC_HOST:localhost}
        port: ${RABBITMQ_ONEC_PORT:5675}
        virtual-host: ${RABBITMQ_ONEC_VHOST:/}
        username: ${RABBITMQ_ONEC_USERNAME:contract_service}
        password: ${RABBITMQ_ONEC_PASSWORD:}
        connection-timeout: 10s
        tls:
          enabled: ${RABBITMQ_ONEC_SSL_ENABLED:false}
          validate-server-certificate: ${RABBITMQ_ONEC_SSL_VALIDATE_CERTIFICATE:true}
          verify-hostname: ${RABBITMQ_ONEC_SSL_VERIFY_HOSTNAME:true}
      listener-auto-startup: ${RABBITMQ_ONEC_LISTENER_AUTO_STARTUP:true}
      queues:
        km-contract-submissions: ${ONEC_QUEUE_KM_CONTRACT_SUBMISSIONS:rvl_contracts_to_1c-usk_km-contract-changes}
        km-contract-registrations: ${ONEC_QUEUE_KM_CONTRACT_REGISTRATIONS:1c-usk_to_rvl_contracts_km-contract-changes}
        lm-policy-requests: ${ONEC_QUEUE_LM_POLICY_REQUESTS:rvl_contracts_to_1c-usk_lm-policy-changes}
        lm-policy-issues: ${ONEC_QUEUE_LM_POLICY_ISSUES:1c-usk_to_rvl_contracts_lm-policy-changes}

  database:
    session-timeouts:
      lock-timeout: ${DB_LOCK_TIMEOUT:5s}
      statement-timeout: ${DB_STATEMENT_TIMEOUT:30s}
      idle-in-transaction-session-timeout: ${DB_IDLE_IN_TRANSACTION_TIMEOUT:1min}

  leadership:
    group: contract-service
    lock-ttl: ${LEADER_LOCK_TTL:30s}
    heartbeat: 1s

  inbox:
    processing:
      interval: ${INBOX_PROCESSING_INTERVAL:10s}
      batch-size: ${INBOX_PROCESSING_BATCH_SIZE:100}
    retry:
      backoff: ${INBOX_RETRY_BACKOFF:1m,5m,15m}
    retention:
      payload: ${INBOX_PAYLOAD_RETENTION:30d}
      interval: ${INBOX_RETENTION_INTERVAL:1h}
      batch-size: ${INBOX_RETENTION_BATCH_SIZE:500}
    pause:
      storage-check-interval: ${INBOX_STORAGE_CHECK_INTERVAL:10s}
      consumer-stop-timeout: ${INBOX_CONSUMER_STOP_TIMEOUT:30s}
    duplicate-delivery-backoff: ${INBOX_DUPLICATE_DELIVERY_BACKOFF:5s}

  outbox:
    publishing:
      interval: ${OUTBOX_PUBLISHING_INTERVAL:5s}
      batch-size: ${OUTBOX_PUBLISHING_BATCH_SIZE:100}
    confirm-timeout: ${OUTBOX_CONFIRM_TIMEOUT:10s}
    retry:
      backoff: ${OUTBOX_RETRY_BACKOFF:1m,5m,15m}
    retention:
      payload: ${OUTBOX_PAYLOAD_RETENTION:30d}
      interval: ${OUTBOX_RETENTION_INTERVAL:1h}
      batch-size: ${OUTBOX_RETENTION_BATCH_SIZE:500}

  contracts:
    numbering:
      zone: ${CONTRACT_NUMBERING_ZONE:Europe/Moscow}

  lm-policy-requests:
    interval: ${LM_POLICY_REQUEST_INTERVAL:10s}
    batch-size: ${LM_POLICY_REQUEST_BATCH_SIZE:100}
    awaiting-interval: ${LM_POLICY_REQUEST_AWAITING_INTERVAL:1m}
    awaiting-threshold: ${LM_POLICY_REQUEST_AWAITING_THRESHOLD:1h}

  km-contract-submissions:
    interval: ${KM_CONTRACT_SUBMISSION_INTERVAL:10s}
    batch-size: ${KM_CONTRACT_SUBMISSION_BATCH_SIZE:100}
    awaiting-interval: ${KM_CONTRACT_SUBMISSION_AWAITING_INTERVAL:1m}
    awaiting-threshold: ${KM_CONTRACT_SUBMISSION_AWAITING_THRESHOLD:1h}

  reference:
    url: ${REFERENCE_URL:}
    connect-timeout: ${REFERENCE_CONNECT_TIMEOUT:2s}
    read-timeout: ${REFERENCE_READ_TIMEOUT:7s}
    retry:
      max-retries: ${REFERENCE_MAX_RETRIES:3}
      delay: ${REFERENCE_RETRY_DELAY:1s}

  storage:
    endpoint: ${S3_ENDPOINT:}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:}
    base-path: ${S3_BASE_PATH:certificates}
    inn: ${S3_INN:0000000000}
    kpp: ${S3_KPP:000000000}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    ssl-bundle: ${S3_SSL_BUNDLE:}
    timeouts:
      connect: ${S3_CONNECT_TIMEOUT:2s}
      read: ${S3_READ_TIMEOUT:10s}
      write: ${S3_WRITE_TIMEOUT:10s}
      call: ${S3_CALL_TIMEOUT:20s}

  attachments:
    max-file-size: ${ATTACHMENT_MAX_FILE_SIZE:5MB}
    content-types:
      "[image/jpeg]": jpg
      "[image/png]": png
      "[application/pdf]": pdf
