/*
 * Сборка одномодульная: один сервис — один build.gradle. Отдельного build-logic,
 * BOM'а и модулей платформы здесь нет намеренно — соседние компоненты ProjectX живут
 * в своих репозиториях и общих артефактов с этим сервисом не имеют.
 *
 * Репозитории выбирает свойство publicRepositories:
 *   - по умолчанию, то есть в рабочем контуре, — только Nexus контура;
 *   - со свойством, равным true, — только публичные: портал плагинов Gradle и Maven Central.
 * Свойство задаётся параметром -PpublicRepositories=true|false или переменной окружения
 * ORG_GRADLE_PROJECT_publicRepositories, её выставляет сборка вне контура.
 *
 * Выбор хранится в gradle.ext: build.gradle по нему же решает, подключать ли внешний
 * набор проверок качества. pluginManagement {} обязан быть первым выражением файла
 * и вычисляется отдельно от остального, поэтому переключатель объявлен внутри него,
 * а адрес Nexus повторён ниже, а не вынесен в переменную.
 */
pluginManagement {
    gradle.ext.publicRepositories = providers.gradleProperty('publicRepositories').map { it.isEmpty() || it.toBoolean() }
            .getOrElse(false)
    repositories {
        if (gradle.ext.publicRepositories) {
            gradlePluginPortal()
            mavenCentral()
        } else {
            maven { url = uri('https://nexus.sogaz.ru/repository/maven-group/') }
        }
    }
}

dependencyResolutionManagement {
    repositories {
        if (gradle.ext.publicRepositories) {
            mavenCentral()
        } else {
            maven { url = uri('https://nexus.sogaz.ru/repository/maven-group/') }
        }
    }
}

/*
 * Рабочий контур без переключателя — только Nexus. Чтобы переключить вручную, замените
 * оба блока выше этими. Строку gradle.ext.gauntletEnabled ниже оставьте как есть: без
 * gradle.ext.publicRepositories она даёт false, и набор проверок не подключается:
 *
 * pluginManagement {
 *     repositories {
 *         maven { url = uri('https://nexus.sogaz.ru/repository/maven-group/') }
 *     }
 * }
 *
 * dependencyResolutionManagement {
 *     repositories {
 *         maven { url = uri('https://nexus.sogaz.ru/repository/maven-group/') }
 *     }
 * }
 */

/*
 * Внешний набор проверок качества подключается, когда его каталог лежит рядом с модулем
 * (путь — в условии ниже) и репозитории публичные: плагин мутаций PIT опубликован только
 * на портале плагинов Gradle, которого в Nexus контура нет. В рабочий контур каталог набора
 * не переносится, так что там набор выключен в любом случае.
 * Принудительно: -Pgauntlet=true|false.
 */
gradle.ext.gauntletEnabled = file('../gauntlet/gauntlet.gradle').isFile() &&
        providers.gradleProperty('gauntlet').map { it.isEmpty() || it.toBoolean() }
                .getOrElse(gradle.ext.has('publicRepositories') && gradle.ext.publicRepositories)

rootProject.name = 'data-reference'
