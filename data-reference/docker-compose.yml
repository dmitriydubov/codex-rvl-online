# Локальный контур для запуска сервиса вне тестов. Тесты поднимают своё
# через Testcontainers и в этом файле не нуждаются.
#
# Значения базы и брокера захардкожены нарочно: это локальный контур, секретов здесь нет.
# Переменные сервиса и аргументы сборки образа — из .env (шаблон .env.example, сам .env
# в git не попадает); без .env действуют умолчания application.yml и Dockerfile.
#
# Запуск: docker compose up -d
# Вместе с самим сервисом из Dockerfile: docker compose --profile app up -d
#
# Брокер здесь изображает межсервисный брокер контура, а не брокер 1С:УСК, и этот
# сервис к нему по умолчанию не подключается: слушатели очередей 1С локально
# не стартуют (spring.rabbitmq.listener.simple.auto-startup). Проверить на нём приём
# и подтверждение всё же можно: RABBITMQ_LISTENER_AUTO_STARTUP=true и очереди 1С,
# заведённые через панель; данных 1С в нём всё равно нет.
#
# ---------------------------------------------------------------------------------------
# Стенд потребителя для сервиса Договоров — профиль stand: PostgreSQL, сервис и закладка
# синтетического сырья 1С (ТЗ-3 → ТЗ-2 → ТЗ-6 → ТЗ-1), которое штатно разбирает планировщик
# сервиса. Брокер стенду не нужен и с ним не стартует. Файлы закладки и примеры запросов
# с ответами — src/test/resources/stand/ (README.md там же); тест ConsumerStandTest сверяет
# примеры с ответами сервиса на тех же файлах.
#
#   ./gradlew clean bootJar        # при JAR_SOURCE=host; с умолчанием build jar собирается в образе
#   docker compose up --build data-reference-stand stand-seed
#
# Сервисы названы явно: профиль stand, включённый целиком (--profile stand up), поднял бы
# и брокер — сервисы без profiles входят в любой набор. Названный сервис включает свой
# профиль сам и тянет только свои depends_on, то есть postgres.
#
# Стенд готов, когда закладка напечатала «сырьё 1С заложено» и прошёл опрос планировщика
# (раз в 10 с): строки inbound_message — PROCESSED, кроме страхователя: у него SKIPPED
# с причиной, так ТЗ-3 помечает контрагента, ставшего страхователем, а не санаторием.
# Сервис — http://localhost:8080 (порт тот же, что у профиля app: вместе их не поднимать).
# Повторный up данных не дублирует. Сброс: docker compose --profile stand down -v —
# том базы общий с профилем app.
#
# В облачной сессии Claude Code контейнеры не выходят в сеть, а Docker Hub отвечает 429:
# в .env — JAR_SOURCE=host и JRE_IMAGE=mirror.gcr.io/library/eclipse-temurin:21-jre,
# образ базы — заранее из зеркала:
#   docker pull mirror.gcr.io/library/postgres:16.10-alpine
#   docker tag mirror.gcr.io/library/postgres:16.10-alpine postgres:16.10-alpine
# В рабочем контуре образы postgres:16.10-alpine и eclipse-temurin:21-jre — из Nexus.
# ---------------------------------------------------------------------------------------

name: data-reference

services:

  postgres:
    image: postgres:16.10-alpine
    container_name: data-reference-postgres
    environment:
      POSTGRES_DB: data_reference
      POSTGRES_USER: data_reference
      POSTGRES_PASSWORD: data_reference
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U data_reference -d data_reference" ]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    container_name: data-reference-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: data_reference
      RABBITMQ_DEFAULT_PASS: data_reference
    ports:
      # 5672 — AMQP; тестовый контур слушает 5671 (TLS), локально TLS не нужен.
      - "5672:5672"
      # Панель управления на http://localhost:15672 — оттуда и создаются очереди,
      # если слушателей включили: сервис их не объявляет (spring.rabbitmq.dynamic: false),
      # потому что на контуре они заведены со стороны 1С:УСК.
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD-SHELL", "rabbitmq-diagnostics -q check_running" ]
      interval: 5s
      timeout: 10s
      retries: 10

  # Сам сервис из Dockerfile — проверить образ локально. В профиле, чтобы обычный
  # docker compose up поднимал только базу и брокер и не собирал образ каждый раз.
  # Переменные — из .env (шаблон .env.example); адреса базы и брокера подменяются
  # на имена сервисов compose: внутри его сети localhost — это сам контейнер.
  data-reference:
    profiles: [ app ]
    build: &data-reference-build
      context: .
      # Аргументы сборки без значений: compose передаёт только те, что заданы в .env
      # или в окружении, остальные берут умолчания из ARG в Dockerfile (jar собирается
      # в образе, базовые образы с Docker Hub, Gradle с services.gradle.org). Форма
      # «ИМЯ: ${ИМЯ:-умолчание}» здесь не годится: она передаёт значение всегда,
      # и умолчания Dockerfile перестают действовать. См. .env.example.
      args:
        - JAR_SOURCE
        - PUBLIC_REPOSITORIES
        - JDK_IMAGE
        - JRE_IMAGE
        - GRADLE_DISTRIBUTION_URL
    container_name: data-reference
    env_file:
      - path: .env
        required: false
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/data_reference
      RABBITMQ_HOST: rabbitmq
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Стенд потребителя, см. шапку. Тот же образ, что у профиля app, но без брокера: нет
  # depends_on на rabbitmq, слушатели 1С выключены явно — чтобы смена умолчания
  # RABBITMQ_LISTENER_AUTO_STARTUP в application.yml стенд не изменила. Переменные
  # сервиса из .env (env_file) сюда не подключаются — стенд не зависит от локальных
  # настроек профиля app; аргументы сборки образа те же, что у app.
  data-reference-stand:
    profiles: [ stand ]
    build: *data-reference-build
    container_name: data-reference-stand
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/data_reference
      RABBITMQ_LISTENER_AUTO_STARTUP: "false"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # Одноразовая закладка сырья стенда: ждёт таблицу inbound_message (её создаёт сервис
  # на старте) и кладёт seed.sql. Файлы — только для чтения. Идемпотентна по message_id.
  stand-seed:
    profiles: [ stand ]
    image: postgres:16.10-alpine
    container_name: data-reference-stand-seed
    entrypoint: [ "sh", "/stand/seed.sh" ]
    environment:
      PGHOST: postgres
      PGDATABASE: data_reference
      PGUSER: data_reference
      PGPASSWORD: data_reference
      PGCLIENTENCODING: UTF8
    volumes:
      - ./src/test/resources/stand:/stand:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  rabbitmq-data:
