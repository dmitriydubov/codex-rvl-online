# Локальный контур для запуска сервиса вне тестов (тесты поднимают своё через Testcontainers).
#
# Пароли здесь известны всем, поэтому порты открыты только на 127.0.0.1, а не всей сети.
# Переменные сервиса и аргументы сборки — из .env (шаблон .env.example), без него действуют
# умолчания application.yml и Dockerfile.
#
#   docker compose up -d                  # база и брокер
#   docker compose --profile app up -d    # и сам сервис из Dockerfile
#
# Брокер здесь — не брокер 1С:УСК: очередей 1С в нём нет, поэтому слушатели 1С по умолчанию
# выключены. Чтобы проверить приём, задайте RABBITMQ_LISTENER_AUTO_STARTUP=true в .env
# и заведите очереди в панели брокера.
#
# Стенд для разработчиков сервиса Договоров (профиль stand): база, сервис и закладка
# синтетических данных 1С — контрагентов, договоров страхования, программ и полисов.
# Брокер стенду не нужен. Файлы и примеры запросов — src/test/resources/stand/ (там README.md).
#
#   ./gradlew clean bootJar               # только при JAR_SOURCE=host
#   docker compose up --build stand-seed
#
# Запускайте именно stand-seed, а не --profile stand: профиль целиком поднял бы и брокер.
# Стенд готов, когда закладка напечатала «сырьё 1С заложено» и пример 09 из README
# отвечает 200 (health отвечает UP раньше, чем данные разобраны). Статус SKIPPED у строки
# страхователя в inbound_message ожидаем: страхователь — не санаторий.
# Сервис — http://localhost:8080; профили app и stand вместе не поднимать (порт один). Клиенту из другого контейнера нужна сеть data-reference_default (адрес
# http://data-reference-stand:8080) или network_mode: host.
# Сброс: docker compose --profile stand down -v (удаляет и базу, и данные брокера).
#
# Если Docker Hub отвечает 429 (Too Many Requests): в .env — JAR_SOURCE=host и
# JRE_IMAGE=mirror.gcr.io/library/eclipse-temurin:21.0.12.1_1-jre, а образ базы — из зеркала:
#   docker pull mirror.gcr.io/library/postgres:16.10-alpine
#   docker tag mirror.gcr.io/library/postgres:16.10-alpine postgres:16.10-alpine
# В рабочем контуре все образы берутся из Nexus.


name: data-reference

services:

  postgres:
    image: postgres:16.10-alpine
    container_name: data-reference-postgres
    environment:
      POSTGRES_DB: data_reference
      POSTGRES_USER: data_reference
      POSTGRES_PASSWORD: data_reference
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U data_reference -d data_reference" ]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    # Та же версия, что у брокера 1С:УСК.
    image: rabbitmq:4.1.2-management-alpine
    container_name: data-reference-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: data_reference
      RABBITMQ_DEFAULT_PASS: data_reference
    ports:
      # Локально без TLS.
      - "127.0.0.1:5672:5672"
      # Панель брокера. Очереди заводятся здесь: сервис их не создаёт, их создаёт 1С:УСК.
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD-SHELL", "rabbitmq-diagnostics -q check_running" ]
      interval: 5s
      timeout: 10s
      retries: 10

  # Сервис из Dockerfile. В профиле, чтобы обычный up не собирал образ каждый раз.
  # Внутри контейнера localhost — он сам, поэтому база и брокер указаны по именам сервисов.
  data-reference:
    profiles: [ app ]
    build: &data-reference-build
      context: .
      # Без значений: compose передаёт только заданные в .env или окружении аргументы,
      # остальные берут умолчания из Dockerfile. Запись ${ИМЯ:-умолчание} их бы перекрыла.
      args:
        - JAR_SOURCE
        - PUBLIC_REPOSITORIES
        - JDK_IMAGE
        - JRE_IMAGE
        - GRADLE_DISTRIBUTION_URL
    container_name: data-reference
    env_file:
      - path: .env
        required: false
    # Пароли заданы явно: в application.yml умолчаний у них нет. У локального брокера нет TLS.
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/data_reference
      DB_PASSWORD: data_reference
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PASSWORD: data_reference
      RABBITMQ_SSL_ENABLED: "false"
      RABBITMQ_LISTENER_AUTO_STARTUP: ${RABBITMQ_LISTENER_AUTO_STARTUP:-false}
      # Тот же порт, что опубликован ниже.
      MANAGEMENT_PORT: ${MANAGEMENT_PORT:-8081}
    ports:
      - "127.0.0.1:8080:8080"
      # Актуатор (health, prometheus).
      - "127.0.0.1:${MANAGEMENT_PORT:-8081}:${MANAGEMENT_PORT:-8081}"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Сервис стенда (см. шапку): тот же образ, но без брокера и без .env, чтобы стенд
  # не зависел от локальных настроек. Проверка брокера в health выключена, иначе был бы DOWN.
  data-reference-stand:
    profiles: [ stand ]
    build: *data-reference-build
    container_name: data-reference-stand
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/data_reference
      DB_PASSWORD: data_reference
      RABBITMQ_LISTENER_AUTO_STARTUP: "false"
      MANAGEMENT_HEALTH_RABBIT_ENABLED: "false"
    ports:
      - "127.0.0.1:8080:8080"
      # Актуатор; порт — умолчание application.yml.
      - "127.0.0.1:8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  # Разовая закладка данных стенда: ждёт схему, которую создаёт сервис на старте, и кладёт
  # seed.sql. Повторный запуск ничего не дублирует.
  stand-seed:
    profiles: [ stand ]
    image: postgres:16.10-alpine
    container_name: data-reference-stand-seed
    entrypoint: [ "sh", "/stand/seed.sh" ]
    environment:
      PGHOST: postgres
      PGDATABASE: data_reference
      PGUSER: data_reference
      PGPASSWORD: data_reference
      PGCLIENTENCODING: UTF8
    volumes:
      - ./src/test/resources/stand:/stand:ro
    depends_on:
      postgres:
        condition: service_healthy
      data-reference-stand:
        condition: service_started

volumes:
  postgres-data:
  rabbitmq-data:
