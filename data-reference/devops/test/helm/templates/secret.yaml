{{- if and .Values.postgres.password .Values.rabbitmq.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.app.name }}-secret
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.app.name }}
type: Opaque
stringData:
  DB_PASSWORD: {{ .Values.postgres.password | quote }}
  RABBITMQ_PASSWORD: {{ .Values.rabbitmq.password | quote }}
{{- else }}
{{- /*
  Passwords are not passed via --set postgres.password=... --set rabbitmq.password=...
  So Secret data-reference-secret must already exist in the namespace, created manually:
    kubectl -n <ns> create secret generic data-reference-secret \
      --from-literal=DB_PASSWORD='...' --from-literal=RABBITMQ_PASSWORD='...'
  This way passwords get into neither values.yaml nor Helm release history.
*/}}
{{- end }}
