spring:
  application:
    name: data-reference

  # Ручки REST — короткие чтения из базы, держать под каждую платформенный поток незачем.
  threads:
    virtual:
      enabled: true

  # Вместе с server.shutdown: на SIGTERM сервис перестаёт принимать запросы и дорабатывает начатые.
  # Сообщение, которое слушатель не успел подтвердить, вернётся из очереди повторно, а приём
  # повторную доставку не дублирует.
  lifecycle:
    timeout-per-shutdown-phase: 30s

  # Поля JSON в ответах — snake_case, как во всех контрактах контура. Сообщения 1С это не затрагивает:
  # они разбираются по своим именам полей.
  jackson:
    property-naming-strategy: SNAKE_CASE

  # Умолчания адреса и пользователя ведут на локальную базу из docker-compose.yml.
  # У пароля умолчания нет: известный пароль из репозитория подошёл бы к любой базе с таким же.
  # Если переменную забыли, запуск падает на миграциях с «password authentication failed».
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/data_reference?logServerErrorDetail=false}
    username: ${DB_USERNAME:data_reference}
    password: ${DB_PASSWORD}
    # Таймауты нужны, чтобы запрос, упёршийся в чужую блокировку или оборванную сеть, не висел
    # бесконечно и не держал поток. Отказ по таймауту — временная ошибка: приём из 1С:УСК встаёт
    # на паузу, разбор повторяет сообщение (по умолчанию через 30 с, 5 мин и 30 мин,
    # projectx.inbound.retry.backoff). Если и это не помогло, сообщение получает FAILED,
    # и вернуть его в работу нужно вручную. Миграции эти таймауты
    # не получают: у них своё соединение (spring.liquibase).
    hikari:
      # Пул приёма, разбора и задач по расписанию. Имя — метка pool в метриках hikaricp: у REST-чтений свой пул
      # rest-read (projectx.database.rest-read-pool), и оповещение о нехватке соединений смотрит на этот.
      pool-name: application
      # Сколько миллисекунд ждать соединения из пула. Когда база недоступна, свободного соединения нет,
      # и запрос отказывает ровно через это время: REST отвечает 503, приём из 1С:УСК встаёт на паузу,
      # разбор повторит сообщение позже. Без настройки пул ждёт 30 с, и REST отвечал бы 503 через
      # полминуты. 2 с — меньше лимита REST-чтения и lock_timeout: при занятом пуле ответ приходит
      # не позже, чем через ожидание соединения плюс лимит чтения. Это же время, округлённое до секунды,
      # ограничивает и вход в базу при открытии нового соединения, во всём процессе. Значение — больше
      # 1000 (проверки соединения ниже); меньше 250 пул не принимает, а 0 означает ждать без предела.
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:2000}
      # Проверка, живо ли соединение, перед выдачей из пула. Она должна быть меньше ожидания соединения,
      # иначе соединение к зависшей базе держит запрос дольше него. Меньше 250 пул не принимает.
      validation-timeout: 1000
      data-source-properties:
        # Таймауты сеанса PostgreSQL задаются при подключении и действуют с первого запроса.
        # Число без единицы PostgreSQL читает как миллисекунды.
        # lock_timeout — ожидание блокировки: свои блокировки сервис держит миллисекунды,
        # секунды ожидания означают чужую долгую транзакцию. statement_timeout — один оператор,
        # 30 с с большим запасом. idle_in_transaction_session_timeout закрывает брошенную
        # транзакцию, которая держит блокировки и мешает VACUUM. Значения — в projectx.database ниже.
        options: >-
          -c lock_timeout=${projectx.database.session-timeouts.lock-timeout}
          -c statement_timeout=${projectx.database.session-timeouts.statement-timeout}
          -c idle_in_transaction_session_timeout=${projectx.database.session-timeouts.idle-in-transaction-session-timeout}
        # Таймаут чтения сокета в секундах — на случай, когда сервер не отвечает вовсе.
        # Поэтому он больше statement_timeout.
        socketTimeout: ${DB_SOCKET_TIMEOUT_SECONDS:60}
        # Без подробностей сервера в тексте ошибки: PostgreSQL называет в них значения строки,
        # а в полисах это персональные данные. На соединение миграций свойства пула не действуют,
        # поэтому тот, кто задаёт свой DB_URL, сохраняет в нём logServerErrorDetail=false.
        logServerErrorDetail: false

  jpa:
    # Схему ведёт Liquibase: изменения схемы мимо миграций нечем откатить.
    hibernate:
      ddl-auto: none
    # Сессия закрывается вместе с транзакцией, ленивые поля не догружаются отдельными запросами.
    open-in-view: false
    properties:
      hibernate:
        type:
          # Без этого Hibernate 7 не работает с колонками jsonb: он ищет Jackson 2, а в сервисе Jackson 3.
          json_format_mapper: ru.projectx.datareference.config.Jackson3JsonFormatMapper

  # Брокер 1С:УСК. Умолчания адреса и логина ведут на локальный брокер из docker-compose.yml.
  # У пароля умолчания нет по той же причине, что у базы.
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    # Тестовый контур слушает 5671 (TLS), локальный брокер — 5672.
    port: ${RABBITMQ_PORT:5672}
    virtual-host: ${RABBITMQ_VHOST:/}
    username: ${RABBITMQ_USERNAME:data_reference}
    password: ${RABBITMQ_PASSWORD}
    # Без таймаута попытка соединиться с недоступным брокером висела бы минутами.
    connection-timeout: 10s
    ssl:
      enabled: ${RABBITMQ_SSL_ENABLED:false}
      # Без проверки сертификата и имени хоста TLS шифрует канал, но не говорит, с кем он.
      # Центр сертификации брокера кладётся в certs/ при сборке образа, а RABBITMQ_HOST должен
      # быть в сертификате брокера. Без ssl.bundle и своего trust-store имя хоста проверяется,
      # только если проверяется и сертификат. На тестовом контуре сертификат самоподписанный,
      # там проверку выключают явно (RABBITMQ_SSL_VALIDATE_CERTIFICATE=false).
      validate-server-certificate: ${RABBITMQ_SSL_VALIDATE_CERTIFICATE:true}
      verify-hostname: ${RABBITMQ_SSL_VERIFY_HOSTNAME:true}
    # Очереди заводит 1С:УСК. Объявление очереди с другими параметрами закрыло бы канал,
    # а точных параметров чужой очереди сервис не знает.
    dynamic: false
    listener:
      simple:
        # Включено по умолчанию: сервис, который молча не читает 1С, хуже упавшего.
        # Выключают там, где очередей 1С нет, — например, в docker-compose.yml.
        auto-startup: ${RABBITMQ_LISTENER_AUTO_STARTUP:true}
        # Подтверждение уходит только после записи сообщения в базу, иначе падение до записи его потеряет.
        acknowledge-mode: manual
        # Нет очереди — значит, неверно имя или контур. Лучше не стартовать, чем бесконечно
        # ждать сообщений из несуществующей очереди.
        missing-queues-fatal: true
        # Порядок сообщений важен: применяется последнее полученное, а параллельные потребители
        # его перемешали бы.
        concurrency: 1
        # Один — тоже ради порядка: сообщение, возвращённое в очередь при отказе базы, не обгонят
        # выданные после него. Так ведут себя classic-очереди и quorum-очереди с delivery-limit;
        # quorum-очередь без лимита ставит возвращённое в конец. Цена — пропускная способность.
        # Тело, которое база не примет никогда, уходит в карантин (таблица quarantine).
        prefetch: 1

  # По потоку на каждую из пяти задач по расписанию: задача, повисшая на долгом запросе,
  # не задерживает остальные, прежде всего проверку базы, от которой зависит возобновление
  # приёма. Пул задаёт SchedulingConfig: при виртуальных потоках Boot иначе дал бы один поток.
  task:
    scheduling:
      pool:
        size: 5

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    # Своё соединение без пула и его таймаутов, чтобы те не оборвали долгую миграцию.
    # Пароль из spring.datasource не наследуется, поэтому задан здесь. Параметры драйвера,
    # нужные и пулу, и миграциям (sslmode и т. п.), задаются в DB_URL.
    url: ${spring.datasource.url}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
    # Иначе Liquibase отправляет сведения об использовании на свой сервер.
    analytics-enabled: false

server:
  # Без этого Tomcat обрывает соединения в момент SIGTERM.
  shutdown: graceful

logging:
  # Журнал в формате JSON (Elastic Common Schema), чтобы сборщик журналов разбирал записи по полям.
  # Ключи MDC (requestId, messageId, stream, queue) попадают в запись все, поэтому персональные
  # данные в MDC класть нельзя. Локально текстовый формат вернёт пустая переменная
  # LOGGING_STRUCTURED_FORMAT_CONSOLE.
  structured:
    format:
      console: ecs
  level:
    # Сюда Hibernate пишет текст SQL-ошибок вместе со значениями строки, то есть с персональными
    # данными. Тип ошибки пишут слушатель и планировщик. Кавычки нужны: без них YAML читает off как false.
    org.hibernate.orm.jdbc.error: "off"

# Актуатор — на своём порту: сервисам, которым открыт REST, незачем видеть состояние и метрики,
# а сетевая политика открывает этот порт только мониторингу и Kubernetes. Своей авторизации у него нет.
# Пробам Kubernetes лучше /livez и /readyz на порту API: они проверяют сервер, который принимает
# запросы. Пробы отвечают состоянием самого приложения, а не базы и брокера: перезапуск пода
# недоступную базу не починит.
# /actuator/health показывает компоненты, чтобы мониторинг видел, чей это DOWN: базы (db) или
# приёма из 1С:УСК (onecIngest). Персональных данных нет ни в деталях health, ни в метриках.
# На порту API /actuator/* отвечает 404. Плавного завершения у порта актуатора нет: на SIGTERM
# он закрывается сразу, и сбор метрик в эти секунды не проходит.
management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include:
          - health
          - prometheus
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
      show-components: always
      show-details: always

projectx:
  database:
    # Таймауты сеанса пула в записи PostgreSQL (ms, s, min); число без единицы — миллисекунды,
    # так что DB_STATEMENT_TIMEOUT=30 означает 30 мс. На старте сервис сверяет их
    # с фактическими и пишет WARN при расхождении: так виден пулер, потерявший настройки,
    # или таймаут, который достался миграциям.
    session-timeouts:
      lock-timeout: ${DB_LOCK_TIMEOUT:5s}
      statement-timeout: ${DB_STATEMENT_TIMEOUT:30s}
      idle-in-transaction-session-timeout: ${DB_IDLE_IN_TRANSACTION_TIMEOUT:1min}
    # Свой пул у REST-чтений: всплеск запросов соседей занимает только его, и приёму с разбором соединения
    # остаются. Адрес, учётные данные, таймауты сеанса и проверку соединений он берёт у пула выше.
    # Всего к базе от экземпляра — сумма двух пулов (по умолчанию 10 + 5).
    rest-read-pool:
      maximum-pool-size: ${DB_REST_POOL_SIZE:5}
      # Сколько ждать свободного соединения, прежде чем ответить 503. Число без единицы — миллисекунды.
      connection-timeout: ${DB_REST_CONNECTION_TIMEOUT_MS:2000}
      # Сетевой тайм-аут чтения в целых секундах: при зависшей базе REST отвечает 503 через это время,
      # а не через DB_SOCKET_TIMEOUT_SECONDS. Больше лимита REST-чтения (api.read-timeout-seconds):
      # медленное чтение отменяет сама база, а этот тайм-аут — только для базы, которая не отвечает.
      socket-timeout-seconds: ${DB_REST_SOCKET_TIMEOUT_SECONDS:5}
      # Сколько секунд драйвер ждёт отправки отмены запроса по лимиту чтения. Зависшая база отмену не примет,
      # а драйвер возвращает ошибку только после этого ожидания (по умолчанию у драйвера 10 с). Лимит чтения
      # вместе с этим ожиданием — не больше сетевого тайм-аута выше.
      cancel-signal-timeout-seconds: ${DB_REST_CANCEL_SIGNAL_TIMEOUT_SECONDS:2}

  # Выключают только тесты: проход посреди теста поменял бы статусы, которые тест проверяет.
  scheduling:
    enabled: true

  # Метрики очереди разбора берутся из памяти и обновляются из базы с этой паузой,
  # поэтому отстают от базы не больше чем на неё.
  metrics:
    backlog-refresh-interval: 30s

  # Задачи над таблицей сырых сообщений. Интервалы — паузы между проходами, поэтому долгий
  # проход не накладывается сам на себя.
  import:
    # Первый проход — не раньше, чем сервис готов к работе.
    initial-delay: 30s
    poll-interval: 10s
    batch-size: 100
    # Сутки покрывают первичную выгрузку, которую 1С присылает многими очередями в любом порядке;
    # короче — справочник теряет записи, пришедшие раньше родителя.
    parent-wait-timeout: ${ONEC_PARENT_WAIT_TIMEOUT:24h}
    # Без предела одна запись журнала при массовой выгрузке вынесла бы тысячи GUID.
    parent-wait-report-limit: 20
    # Тела полисов и договоров страхования могут содержать персональные данные: через payload-ttl
    # после приёма их тело стирается, как и тело пропущенных сообщений; строка остаётся.
    # Стирание идёт короткими транзакциями пачками.
    payload-ttl: 30d
    retention-poll-interval: 1h
    retention-batch-size: 500
    # В карантинном теле могут быть персональные данные любой очереди, поэтому срок как у полиса.
    quarantine-ttl: 30d
    # ФИО, дата рождения и почта застрахованного живут в полисе этот запас после окончания срока или перевода
    # в архив, потом стираются тем же проходом. Срок согласуется с ответственным за персональные данные.
    policy-personal-data-grace: ${POLICY_PERSONAL_DATA_GRACE:30d}
    # Многочастные передачи прайсов, которые ждут частей дольше порога, попадают в предупреждение.
    stuck-transfer-threshold: 1h
    stuck-transfer-poll-interval: 15m
    stuck-transfer-report-limit: 20

  # Кэш справочных ответов. Сообщение 1С сразу сбрасывает зависящие от него ответы, а срок жизни
  # ограничивает, как долго не видна правка базы мимо 1С. Полисы не кэшируются.
  # Предел — число ответов в каждом кэше, а не во всех вместе.
  cache:
    ttl: ${REFERENCE_CACHE_TTL:10m}
    maximum-size: ${REFERENCE_CACHE_MAXIMUM_SIZE:1000}

  api:
    # «Действует на сегодня» считается по московскому дню, иначе по UTC три часа в сутки договоры
    # отставали бы на день.
    zone: Europe/Moscow
    # Виды обращения восстановительного лечения: по ним отбираются позиции размещения, а не
    # процедуры. Если наименования нет в справочнике, на старте будет WARN.
    rvl-appeal-types:
      - РВЛ и СКЛ
      - РВЛ в России
    # Пределы входа поиска защищают сервис от объёма. Превышение — 400 VALIDATION_ERROR.
    # Они должны быть намного меньше предела заголовков запроса у сервера (8 КБ), иначе вместо
    # понятного 400 ответит Tomcat.
    search:
      max-query-length: 100
    mkb10:
      max-query-length: 100
      max-codes: 100
    # Путёвка длится недели. Год с запасом на високосный отсекает опечатки в датах до чтения базы.
    price:
      max-nights: 366
    # Не уложившееся чтение отвечает 503, и потребитель повторяет запрос. Лимит меньше lock_timeout,
    # чтобы под чужой блокировкой REST отказывал первым и освобождал соединение.
    read-timeout-seconds: ${API_READ_TIMEOUT_SECONDS:3}

  onec:
    ingest:
      # Пауза перед повтором, когда две доставки одного сообщения столкнулись на записи:
      # без неё повтор превратился бы в горячий цикл.
      duplicate-delivery-backoff: 5s
      # Как часто во время паузы приёма проверять, ожила ли база. Это и наибольшая задержка
      # возобновления приёма. Пока приём стоит, health отвечает DOWN.
      storage-check-interval: 10s
    contract:
      # Вид деятельности «РВЛ», по которому санатории отделяются от прочих контрагентов.
      # Умолчания в коде нет нарочно: неверный GUID молча оставил бы справочник санаториев пустым.
      # Признак ошибки — пустая таблица lpu при непустой insurers.
      rvl-activity-id: f3876c53-c7d8-4620-b364-9538164ba5d4

      # Тип продукта договора ДМС. Без него договоры страхования не применяются: ДМС не отличить от еОСАГО.
      dms-product-type: Личное страхование

    # Имена очередей сняты со списка очередей брокера: в документах 1С:УСК они записаны иначе.
    # На новом контуре сверять со списком брокера снова. Умолчаний в коде нет: при включённых
    # слушателях опечатка роняет запуск, а не выглядит как «сообщений нет». Имена должны быть
    # разными: имя очереди служит и именем её точки приёма, и повтор роняет запуск всегда.
    queues:
      policies: ${ONEC_QUEUE_POLICIES:1c-usk_to_rvl-online_policies}
      insurance-contracts: ${ONEC_QUEUE_INSURANCE_CONTRACTS:1c-usk_to_rvl-online_contracts-changes}
      contragents: ${ONEC_QUEUE_CONTRAGENTS:1c-usk_to_rvl-online_contragents-ul-changes}
      mkb10: ${ONEC_QUEUE_MKB10:1c-usk_to_rvl-online_mkb10-changes}
      lpu-contracts: ${ONEC_QUEUE_LPU_CONTRACTS:1c-usk_to_rvl-online_contragents-contracts-changes}
      programs: ${ONEC_QUEUE_PROGRAMS:1c-usk_to_rvl-online_programms-changes}
      appeal-types: ${ONEC_QUEUE_APPEAL_TYPES:1c-usk_to_rvl-online_types-treatments-changes}
      lpu-contacts: ${ONEC_QUEUE_LPU_CONTACTS:1c-usk_to_rvl-online_contact-information-changes}
      price-lists: ${ONEC_QUEUE_PRICE_LISTS:1c-usk_to_rvl-online_pricelists-contragents-changes}
      price-lists-final: ${ONEC_QUEUE_PRICE_LISTS_FINAL:1c-usk_to_rvl-online_pricelists-contragents-changes-final}
      contragent-services: ${ONEC_QUEUE_CONTRAGENT_SERVICES:1c-usk_to_rvl-online_contragents-services-changes}
