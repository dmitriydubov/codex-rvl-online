spring:
  application:
    name: data-reference

  # REST обслуживается на виртуальных потоках: ручки — короткие чтения из базы,
  # и держать под каждое платформенный поток незачем.
  threads:
    virtual:
      enabled: true

  # Плавное завершение вместе с server.shutdown ниже: на SIGTERM от Kubernetes сервис
  # перестаёт принимать запросы, дорабатывает начатые и только потом гасит контекст.
  # Слушатель очереди за это время подтверждает сообщение в работе; что не успел —
  # вернётся в очередь неподтверждённым и придёт снова, дедупликация это переживёт.
  lifecycle:
    timeout-per-shutdown-phase: 30s

  # Поля JSON наружу — snake_case, как во всех контрактах контура (individual_request_id,
  # external_id, request_id). На разбор сообщений 1С не влияет: маппер читает их деревом,
  # по именам полей источника, а не в POJO.
  jackson:
    property-naming-strategy: SNAKE_CASE

  # Умолчания адреса и пользователя — для локального контура из docker-compose.yml. Stage
  # и prod передают свои значения переменными окружения, код при этом не меняется.
  # У пароля умолчания нет: известный пароль в репозитории подошёл бы к любой базе, которую
  # подняли с ним же. О незаданной переменной связывание свойств не сообщает: драйверу
  # уходит строка «${DB_PASSWORD}» как есть, и запуск падает на миграциях с
  # «password authentication failed».
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/data_reference?logServerErrorDetail=false}
    username: ${DB_USERNAME:data_reference}
    password: ${DB_PASSWORD}
    # Таймауты соединений пула приложения. Без них запрос, упёршийся в чужую блокировку
    # или в оборванную сеть, висит бесконечно и держит поток, который его выполняет. С ними
    # каждый запрос держит свою задачу по расписанию не дольше lock_timeout, statement_timeout
    # или socketTimeout. Проход разбора может упереться в такое ожидание до batch-size раз подряд
    # (по разу на сообщение пачки), но у каждой задачи свой поток в пуле (spring.task.scheduling
    # ниже), и стирание персональных данных и проверка зависших передач его не ждут.
    # Отказ по таймауту — обычное исключение. Слушатель оставит сообщение в очереди и поставит
    # приём из 1С:УСК на паузу до восстановления базы (projectx.onec.ingest ниже). Разбор
    # запишет сообщению «временная ошибка» и повторит по лестнице (30 с / 5 мин / 30 мин), а
    # когда она исчерпана — FAILED: блокировка дольше получаса уводит затронутые сообщения
    # в отказ, их возвращают в работу вручную. Стирание и проверка повторят попытку на
    # следующем проходе. Миграциям эти ограничения не достаются: у Liquibase своё соединение,
    # см. spring.liquibase ниже.
    hikari:
      data-source-properties:
        # Параметры сеанса PostgreSQL в стартовом пакете соединения (pgjdbc: options,
        # «-c имя=значение» через пробел) — действуют с первого запроса, без лишнего
        # обмена с сервером. Значения — с единицами PostgreSQL (ms, s, min): число без
        # единицы PostgreSQL читает как миллисекунды.
        #   lock_timeout — ожидание одной блокировки (SQLSTATE 55P03). Чтения и записи
        #     сервиса берут блокировки на миллисекунды; секунды ожидания — это чужая
        #     долгая транзакция или ручной SQL, и ждать её дальше незачем.
        #   statement_timeout — один оператор целиком (57014). Самое тяжёлое — сообщение
        #     программы страхования на ~1000 строк, но каждая его строка — отдельный INSERT, и таймер
        #     сбрасывается по завершении каждого Execute (при пакетной отправке JDBC
        #     тоже), так что 30 с — запас на порядки.
        #   idle_in_transaction_session_timeout — транзакция открыта, а запросов нет
        #     (25P03, сеанс закрывается, пул заменит соединение). Транзакции сервиса
        #     не ждут внешних систем, а брошенная держит блокировки и мешает VACUUM.
        # Значения — из projectx.database.session-timeouts ниже: там же их сверяет проверка при старте.
        options: >-
          -c lock_timeout=${projectx.database.session-timeouts.lock-timeout}
          -c statement_timeout=${projectx.database.session-timeouts.statement-timeout}
          -c idle_in_transaction_session_timeout=${projectx.database.session-timeouts.idle-in-transaction-session-timeout}
        # Таймаут чтения сокета драйвером, в секундах (pgjdbc: socketTimeout). Последний
        # рубеж на случай, когда сервер не ответит вовсе, даже отменой по
        # statement_timeout: поэтому больше него. Соединение после него закрывается.
        socketTimeout: ${DB_SOCKET_TIMEOUT_SECONDS:60}
        # Без подробностей сервера в тексте ошибки (pgjdbc: logServerErrorDetail, по
        # умолчанию true). Подробности PostgreSQL называют значения строки: «Key (email)=(…)
        # already exists», а в полисах это персональные данные. Сервис сам текст ошибки базы
        # никуда не пишет, но его выводит любой стек в журнале. Код SQLSTATE от этого не
        # меняется. Для соединения миграций тот же параметр стоит в умолчании DB_URL выше:
        # свойства пула до него не доходят, и окружение, задающее DB_URL, добавляет его само.
        logServerErrorDetail: false

  jpa:
    # Схему ведёт Liquibase. Hibernate её не трогает: ddl-auto на живой базе — это
    # изменения, которых нет ни в одном ревью и которые нечем откатить.
    hibernate:
      ddl-auto: none
    # Сессия закрывается вместе с транзакцией сервиса. С open-in-view ленивые поля
    # догружаются уже за её границей — то есть отдельным запросом на каждое обращение.
    open-in-view: false
    properties:
      hibernate:
        type:
          # Без этого Hibernate 7 не отображает колонки jsonb вовсе: он ищет Jackson 2,
          # а Boot 4 приносит Jackson 3. Разбор — в javadoc самого класса.
          json_format_mapper: ru.projectx.datareference.config.Jackson3JsonFormatMapper

  # Брокер 1С:УСК — единственный брокер, с которым говорит этот сервис. Умолчания
  # адреса и логина ведут на локальный контур из docker-compose.yml; адрес, учётные данные
  # и TLS настоящего контура приходят переменными окружения. Учётные данные в репозиторий
  # не попадают ни в каком виде, поэтому у пароля умолчания нет (как у spring.datasource:
  # не заданная переменная уходит брокеру строкой «${RABBITMQ_PASSWORD}», и при включённых
  # слушателях запуск падает на ошибке аутентификации).
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    # Тестовый контур слушает 5671 (TLS). Локальный брокер — обычные 5672.
    port: ${RABBITMQ_PORT:5672}
    virtual-host: ${RABBITMQ_VHOST:/}
    username: ${RABBITMQ_USERNAME:data_reference}
    password: ${RABBITMQ_PASSWORD}
    # Внешний вызов без таймаута — дефект: без него попытка соединиться с недоступным
    # брокером висит до таймаута операционной системы, то есть минутами.
    connection-timeout: 10s
    ssl:
      enabled: ${RABBITMQ_SSL_ENABLED:false}
      # С включённым TLS сертификат брокера и имя хоста в нём проверяются всегда, если
      # контур явно не сказал иначе: без проверки TLS шифрует канал, но не говорит, с кем.
      # Без ssl.bundle и spring.rabbitmq.ssl.trust-store клиент доверяет хранилищу JVM: центр
      # сертификации брокера кладётся в certs/ при сборке образа (см. Dockerfile), а имя хоста
      # (RABBITMQ_HOST) должно быть в сертификате. В этом же случае verify-hostname действует
      # только вместе с validate-server-certificate: при false клиент доверяет любому
      # сертификату и имя не сверяет. Тестовый контур — исключение: сертификат там
      # самоподписанный и без имени хоста, поэтому его манифест обязан выключать проверку
      # явно (RABBITMQ_SSL_VALIDATE_CERTIFICATE=false), и клиент RabbitMQ печатает на старте
      # SECURITY ALERT.
      validate-server-certificate: ${RABBITMQ_SSL_VALIDATE_CERTIFICATE:true}
      verify-hostname: ${RABBITMQ_SSL_VERIFY_HOSTNAME:true}
    # Очереди на брокере заведены со стороны 1С:УСК. Свой AmqpAdmin не нужен
    # и вреден: объявление с параметрами, отличными от фактических (durable, аргументы),
    # закрывает канал — а фактических параметров чужой очереди мы не знаем.
    dynamic: false
    listener:
      simple:
        # Стартовать ли слушателей. Умолчание — как у Boot, включено: сервис, который
        # стартует и молча не читает 1С, хуже упавшего, и забытая в манифесте переменная
        # не должна к этому приводить. Выключают слушателей явно (false) там, где брокера
        # 1С нет: локальный RabbitMQ из docker-compose.yml изображает межсервисный брокер
        # контура, очередей 1С в нём нет, и с missing-queues-fatal ниже запуск упал бы
        # на первой же — поэтому compose и .env.example задают false.
        auto-startup: ${RABBITMQ_LISTENER_AUTO_STARTUP:true}
        # Подтверждение уходит из слушателя вручную и только после того, как приём
        # зафиксирован в базе. При автоматическом сообщение считается обработанным
        # в момент доставки, и падение до коммита теряет его молча.
        acknowledge-mode: manual
        # Очереди нет на брокере — значит, имя задано неверно либо контур не тот.
        # С этим значением потребитель делает три попытки объявления и роняет запуск
        # приложения; со сброшенным — повторяет попытку бесконечно, а в логе это
        # выглядит как «сообщений нет» и обнаруживается через неделю по пустому
        # справочнику. Пусть лучше не стартует.
        missing-queues-fatal: true
        # По одному потребителю на очередь. Порядок сообщений внутри потока значим —
        # прайс собирается из частей одной передачи, а версии сообщения (dataVersion) сервис
        # не сравнивает: применяется последнее полученное, и порядок держится только
        # на пути доставки, — а параллельные потребители его перемешивают.
        concurrency: 1
        # Сколько сообщений брокер отдаёт потребителю, не дожидаясь подтверждения. Один —
        # ради порядка. Сообщение, не записанное из-за временного отказа базы, остаётся
        # неподтверждённым, потребители встают на паузу, и при остановке контейнера оно
        # возвращается в очередь на прежнее место; выданные сверх него контейнер перед
        # остановкой дорабатывает, и при 20 они записались бы раньше возвращённого (зонд
        # с возвратом в очередь давал порядок [2, 3, 4, 5, 1] вместо [1, 2, 3, 4, 5]; порядок
        # при паузе показывает тест OneCQueueOrderTest), а применяется последнее записанное.
        # «На прежнее место» — правило classic-очереди и quorum-очереди с delivery-limit
        # (в 4.x по умолчанию 20 доставок, дальше сообщение сбрасывается или уходит в DLX);
        # quorum-очередь без лимита ставит возвращённое в конец, и порядок не держит никакой
        # prefetch. Цена — пропускная способность очереди. Тело, которое база не примет никогда,
        # очередь не держит: оно уходит в карантин (таблица quarantine) с ERROR в журнале.
        prefetch: 1

  # Пул потоков задач по расписанию. Задач пять: разбор сырых сообщений, стирание персональных
  # данных, проверка зависших передач прайсов, проверка базы во время паузы приёма из 1С:УСК и
  # обновление метрик очереди разбора (projectx.metrics ниже). Пять потоков — по одному на задачу,
  # так что задача, повисшая на долгом запросе (а при недоступной базе висят до своих таймаутов
  # все, кто в неё ходит), не задерживает остальные — прежде всего проверку базы, от которой
  # зависит, когда приём возобновится. Больше не нужно:
  # каждая задача идёт с паузой между проходами и сама на себя не накладывается. Пул задаёт
  # ru.projectx.datareference.config.SchedulingConfig; без него при виртуальных потоках Boot
  # выполнял бы все задачи на одном потоке.
  task:
    scheduling:
      pool:
        size: 5

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    # Своё соединение для миграций, не из пула: таймауты пула (spring.datasource.hikari)
    # оборвали бы долгую миграцию — построение индексов pg_trgm на полной таблице
    # или ожидание блокировки на живой базе. Заданный url велит Boot собрать
    # Liquibase отдельный DataSource из этих трёх свойств (без пула и без таймаутов);
    # пароль при этом из spring.datasource не наследуется, поэтому задан здесь же.
    # Отсюда правило: параметры драйвера, нужные и пулу, и миграциям (sslmode,
    # sslrootcert, targetServerType), задаются в DB_URL, а не в data-source-properties.
    url: ${spring.datasource.url}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
    # Liquibase 5 при каждом запуске миграций по умолчанию обращается к config.liquibase.com
    # и отправляет туда сведения об использовании. В контуре выхода наружу нет, а сервису
    # это не нужно нигде: выключено явно.
    analytics-enabled: false

server:
  # См. spring.lifecycle: без этого Tomcat обрывает соединения в момент SIGTERM.
  shutdown: graceful

logging:
  # Журнал в консоль пишется в формате Elastic Common Schema (ECS): каждая строка — отдельный
  # объект JSON, и сборщик журналов разбирает её по полям, а не по тексту. Ключи MDC становятся
  # полями записи: requestId у REST-запроса, messageId, stream и queue у сообщения 1С:УСК. По ним
  # находится вся история запроса или сообщения. Имя сервиса в записи (service.name) берётся
  # из spring.application.name. Заставку Spring Boot при таком формате в консоль не выводит.
  # Объектом JSON становится всё, что сервис и библиотеки пишут через журнал. Простым текстом
  # остаётся только то, что идёт в консоль мимо журнала: сообщения самой JVM и прямой вывод
  # в System.out и System.err. Ключи MDC попадают в запись все, какие есть, поэтому класть
  # в MDC персональные данные нельзя. Локально вернуть текстовый формат можно пустой
  # переменной окружения LOGGING_STRUCTURED_FORMAT_CONSOLE.
  structured:
    format:
      console: ecs
  level:
    # Сюда Hibernate пишет текст каждой SQL-ошибки (HHH000247 и сообщение драйвера) —
    # а PostgreSQL кладёт в него Detail и Where со значениями строки, то есть
    # с персональными данными полисов. Категория служит только этому, поэтому выключена
    # целиком. Сама ошибка не теряется: тип исключения пишут слушатель и планировщик,
    # полный текст планировщик сохраняет в строке сырья (last_error). В кавычках —
    # без них YAML читает off как false.
    org.hibernate.orm.jdbc.error: "off"

# Актуатор отвечает на своём порту (MANAGEMENT_PORT, умолчание 8081), а не на порту API: сервисам,
# которым открыт REST, незачем видеть состояние компонентов и метрики, а сетевая политика контура
# открывает этот порт только мониторингу и Kubernetes. На порту API /actuator/* отвечает 404.
# Пробы Kubernetes есть на обоих портах: /actuator/health/liveness и /readiness — на порту актуатора,
# /livez и /readyz — на порту API. Пробам лучше второе: у порта актуатора свой сервер и свои потоки,
# и проба на нём проходила бы, даже когда сервер API запросов уже не принимает. Короткие пути
# отдают только состояние самого приложения, без компонентов и метрик.
# Плавного завершения у порта актуатора нет (server.shutdown на него не действует): на SIGTERM
# он закрывается сразу, и опрос метрик в эти секунды не пройдёт. Пробам это не мешает — они
# на порту API, который дорабатывает начатые запросы.
# Наружу открыты две ручки: health и prometheus. Группы liveness и readiness отвечают состоянием
# самого приложения, а не базы и брокера: перезапуск пода недоступную базу не починит, а снятие
# трафика с REST не поможет — он и так отвечает 503, пока база недоступна.
# Сам /actuator/health показывает компоненты и их детали: мониторингу нужно видеть не только
# DOWN, но и чей это DOWN — базы (db) или приёма из 1С:УСК (onecIngest). Приём отвечает DOWN по
# двум причинам: потребители очередей стоят на паузе из-за базы (в деталях — SQLSTATE и тип отказа,
# момент остановки и очереди) или у какой-то очереди нет подписанного потребителя (в деталях —
# queuesWithoutConsumer). Персональных данных в деталях нет: причина отказа — код, а не текст ошибки базы.
# /actuator/prometheus отдаёт метрики в формате Prometheus: приём из 1С:УСК (onec_ingest_*), разбор
# сырых сообщений (onec_inbound_*), зависшие передачи прайсов, тела старше срока хранения, а также
# то, что Spring Boot считает сам (JVM, пул соединений, HTTP, слушатели очередей). В метриках нет
# персональных данных и идентификаторов сообщений: только поток, очередь, статус и исход.
# Своей авторизации у обеих ручек нет: их закрывает сетевая политика контура на порту актуатора.
management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include:
          - health
          - prometheus
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
      show-components: always
      show-details: always

projectx:
  database:
    # Таймауты сеанса пула приложения, в записи PostgreSQL с единицей: ms, s, min, h, d.
    # Уходят в стартовый options пула (spring.datasource.hikari выше). При старте сервис читает
    # их на соединении пула и сверяет с этими значениями, а на соединении миграций ждёт 0:
    # расхождение — WARN по параметру, старт не прерывается. Так видны пулер, молча выбросивший
    # options, и таймаут на роли или базе, доставшийся миграциям.
    session-timeouts:
      lock-timeout: ${DB_LOCK_TIMEOUT:5s}
      statement-timeout: ${DB_STATEMENT_TIMEOUT:30s}
      idle-in-transaction-session-timeout: ${DB_IDLE_IN_TRANSACTION_TIMEOUT:1min}

  # Задачи по расписанию. Выключают их только тесты (false): проход, проснувшийся посреди
  # теста, поменял бы статусы, которые тест проверяет, поэтому тесты вызывают проходы сами.
  # В работающем сервисе расписания включены всегда.
  scheduling:
    enabled: true

  # Метрики очереди разбора сырых сообщений 1С (/actuator/prometheus): сколько сообщений каждого
  # потока ждут разбора, ждут частей передачи или ушли в отказ, сколько передач прайсов зависло и
  # сколько тел не стёрто в срок. Скрейп читает их из памяти, а из базы их перечитывает задача по
  # расписанию с этой паузой: столько, не больше, метрики отстают от базы. Насколько отстают сейчас,
  # показывает метрика onec_inbound_backlog_staleness_seconds.
  metrics:
    backlog-refresh-interval: 30s

  # Задачи по расписанию над таблицей сырых сообщений. Интервалы — паузы между концом одного
  # прохода и началом следующего, поэтому долгий проход не накладывается сам на себя.
  import:
    # Сколько все три задачи ждут после старта до первого прохода: не раньше, чем сервис
    # готов к работе. Ноль — без задержки. Пустое значение даёт умолчание, 30 с.
    initial-delay: 30s
    # Разбор сырых сообщений: пауза между проходами и сколько сообщений берёт один проход.
    poll-interval: 10s
    batch-size: 100
    # Стирание тел сообщений полисов с персональными данными: тело живёт payload-ttl после
    # приёма, потом стирается, строка остаётся. Стирает пачками по retention-batch-size строк,
    # каждая пачка — своя короткая транзакция, пока пачки полные.
    payload-ttl: 30d
    retention-poll-interval: 1h
    retention-batch-size: 500
    # Срок хранения тела карантинного сообщения (таблица quarantine — тела, которые база не приняла
    # в сырьё). Тело не разобрано, и по имени очереди нельзя поручиться, что в нём нет персональных
    # данных, поэтому срок один для всех очередей и равен сроку тела полиса. Стирает тот же проход,
    # теми же пачками; запись с очередью, message-id и причиной остаётся.
    quarantine-ttl: 30d
    # Проверка многочастных передач прайсов, которые ждут своих частей дольше порога.
    # Предупреждение называет не больше stuck-transfer-report-limit самых давних передач.
    stuck-transfer-threshold: 1h
    stuck-transfer-poll-interval: 15m
    stuck-transfer-report-limit: 20

  api:
    # Календарный день для правила «действует на сегодня» в ответах REST: сервис живёт
    # в UTC, а день считается московский, иначе три часа в сутки договоры отставали бы
    # на день. День вычисляется на запрос и уходит в SQL параметром, не CURRENT_DATE.
    zone: Europe/Moscow
    # Виды обращения восстановительного лечения по наименованию: по ним из перечня
    # программы и из услуг прайсового договора отбираются позиции размещения,
    # а не процедуры и анализы. Сравнение без учёта регистра и краевых пробелов; на старте
    # сервис пишет WARN, если хотя бы одного наименования нет в appeal_types. Когда 1С
    # пришлёт идентификаторы видов обращения, их место здесь же.
    rvl-appeal-types:
      - РВЛ и СКЛ
      - РВЛ в России
    # Верхние пределы того, что вызывающий присылает в поиск. Длина строки поиска считается в символах по строке
    # как пришла, вместе с пробелами по краям; число кодов — тоже как пришло, вместе с повторами. Превышение —
    # ответ 400 VALIDATION_ERROR с именем поля. Пределы защищают сервис от объёма и должны оставаться много
    # меньше предела длины строки запроса у встроенного сервера (server.max-http-request-header-size, 8 КБ).
    # Остальные пределы поиска (умолчание и максимум выдачи, минимальная длина строки) заданы умолчаниями в коде.
    search:
      # Поиск полисов договора по части ФИО или номера.
      max-query-length: 100
    mkb10:
      # Подсказка по МКБ-10 и раскрытие перечня кодов разом.
      max-query-length: 100
      max-codes: 100
    # Расчёт стоимости размещения: наибольшая длина периода в ночах (выезд минус заезд, день выезда не
    # оплачивается). Путёвка длится недели; год с запасом на високосный отсекает опечатки в датах до чтения
    # базы. Период длиннее — ответ 400 VALIDATION_ERROR по полю date_to.
    price:
      max-nights: 366
    # Лимит времени REST-чтения, целые секунды: чтение, не уложившееся в него, отвечает 503
    # SERVICE_UNAVAILABLE, и потребитель повторяет запрос. Меньше lock_timeout пула (5 с), чтобы под
    # чужой блокировкой REST отказывал первым и отдавал соединение; чтения по ключу занимают миллисекунды.
    # Лимит ставится на каждый оператор JDBC отдельно и целыми секундами: запросы репозиториев получают
    # остаток, округлённый до ближайшей секунды (меньше половины секунды — ноль, то есть оператор идёт
    # без таймаута JDBC, под lock_timeout и statement_timeout сеанса), чтение по ключу и ленивая догрузка
    # связей — остаток, округлённый вниз, но не меньше одной секунды. Это защита от зависания, а не точный
    # срок на весь запрос.
    read-timeout-seconds: ${API_READ_TIMEOUT_SECONDS:3}

  onec:
    # Приём из очередей 1С:УСК.
    ingest:
      # Пауза перед возвратом сообщения в очередь, когда две доставки одного сообщения столкнулись
      # на записи (SQLSTATE 23505) и вторую нужно повторить: без паузы брокер отдаёт сообщение обратно
      # немедленно, и повтор становится горячим циклом.
      duplicate-delivery-backoff: 5s
      # Как часто во время паузы приёма (база не принимала записи: нет соединения, таблицы приёма под
      # чужой блокировкой дольше lock_timeout) сервис проверяет, отвечает ли база снова, чтобы вернуть
      # потребителей очередей. Пока приём не на паузе, проверка к базе не ходит. Это и наибольшая
      # задержка возобновления приёма после восстановления базы. Пока потребители стоят,
      # /actuator/health отвечает DOWN с компонентом onecIngest.
      storage-check-interval: 10s
    contract:
      # GUID вида деятельности «РВЛ» (восстановительное лечение), по которому санатории
      # отделяются от прочих контрагентов 1С. В документе на его месте
      # плейсхолдер; фактическое значение уточнено отдельно и принадлежит контуру.
      # В коде умолчания у него нет намеренно: подставленный наугад GUID дал бы пустой
      # справочник санаториев без единой ошибки в логе — все сообщения аккуратно
      # уходили бы в пропуск как «не РВЛ».
      #
      # Что значение верное, показывают данные: пустая таблица lpu при непустой insurers
      # означает, что GUID не тот.
      rvl-activity-id: f3876c53-c7d8-4620-b364-9538164ba5d4

      # Тип продукта, по которому договор страхования признаётся договором ДМС.
      # Документ называет это значение прямо, но оговаривает, что оно фиксируется при
      # подключении к контуру, — поэтому здесь, а не константой в коде. Не задано —
      # поток договоров страхования не применяется вовсе: отличить ДМС от еОСАГО нечем.
      dms-product-type: Личное страхование

    # Имена очередей — конфигурация контура, а не константы кода. В документах и в письме
    # со стороны 1С:УСК они названы иначе, чем объявлены на брокере: `1c-usk_to_rvl_online…`
    # против фактического `1c-usk_to_rvl-online…`, у очереди адресов санаториев —
    # `-information-changes` без `contact`, у очередей прайсов — через подчёркивания. Ниже — то, что снято со списка
    # очередей брокера; при развёртывании на новом контуре сверять со списком снова.
    #
    # Умолчаний у записи OneCQueueProperties нет намеренно: имя должно прийти отсюда или
    # из переменной. При включённых слушателях опечатка в имени роняет запуск
    # (missing-queues-fatal выше), а не оборачивается тихим «сообщений нет». Имена должны
    # быть разными: имя очереди служит и идентификатором её точки приёма, и повтор роняет
    # старт при любом auto-startup.
    queues:
      policies: ${ONEC_QUEUE_POLICIES:1c-usk_to_rvl-online_policies}
      # Заведена на контуре через дефис, как и остальные. В документе потока договоров страхования
      # она шла через подчёркивание (rvl_online), и с таким именем сервис на контуре не стартовал.
      # Сверять со списком брокера, а не с документом.
      insurance-contracts: ${ONEC_QUEUE_INSURANCE_CONTRACTS:1c-usk_to_rvl-online_contracts-changes}
      contragents: ${ONEC_QUEUE_CONTRAGENTS:1c-usk_to_rvl-online_contragents-ul-changes}
      mkb10: ${ONEC_QUEUE_MKB10:1c-usk_to_rvl-online_mkb10-changes}
      lpu-contracts: ${ONEC_QUEUE_LPU_CONTRACTS:1c-usk_to_rvl-online_contragents-contracts-changes}
      programs: ${ONEC_QUEUE_PROGRAMS:1c-usk_to_rvl-online_programms-changes}
      appeal-types: ${ONEC_QUEUE_APPEAL_TYPES:1c-usk_to_rvl-online_types-treatments-changes}
      lpu-contacts: ${ONEC_QUEUE_LPU_CONTACTS:1c-usk_to_rvl-online_contact-information-changes}
      price-lists: ${ONEC_QUEUE_PRICE_LISTS:1c-usk_to_rvl-online_pricelists-contragents-changes}
      price-lists-final: ${ONEC_QUEUE_PRICE_LISTS_FINAL:1c-usk_to_rvl-online_pricelists-contragents-changes-final}
      contragent-services: ${ONEC_QUEUE_CONTRAGENT_SERVICES:1c-usk_to_rvl-online_contragents-services-changes}
