# Причины исхода у полисов, тело которых уже стёрто по сроку хранения персональных данных.
databaseChangeLog:

  - changeSet:
      id: 015-erase-policy-reasons
      author: rvl-online
      comment: >
        Срок хранения персональных данных теперь стирает у полиса вместе с телом и причину исхода: раньше
        в неё попадал текст ошибки базы, а он печатает значения полей. Строки, тело которых стёрли до этого
        изменения, проход стирания больше не выбирает, потому что ищет только полисы с телом. Здесь их
        причина стирается один раз. Статус и число попыток остаются. Отката нет: стёртое не восстановить.
      changes:
        - sql:
            sql: >
              update inbound_message
                 set last_error = null
               where stream = 'POLICIES'
                 and payload is null
                 and last_error is not null
      rollback:
        - empty: {}
