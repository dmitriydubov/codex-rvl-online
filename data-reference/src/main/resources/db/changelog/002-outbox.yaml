databaseChangeLog:

  - changeSet:
      id: 002-outbox
      author: data-reference-service
      comment: >
        Сырьё из 1С: сообщение целиком плюс статус его обработки. Ключ — message_id,
        как и у inbox: на одно сообщение приходится ровно одна строка сырья, а дубли
        сюда не доходят, их отсекает журнал входящих. Внешнего ключа на inbox нет
        намеренно — у таблиц разные задачи и разное время жизни.
      changes:
        - createTable:
            tableName: outbox
            columns:
              - column:
                  name: message_id
                  type: uuid
                  constraints: { primaryKey: true, primaryKeyName: pk_outbox, nullable: false }
              - column:
                  name: stream
                  type: text
                  constraints: { nullable: false }
              - column:
                  name: source_queue
                  type: text
                  constraints: { nullable: false }
              - column:
                  name: payload
                  type: jsonb
                  constraints: { nullable: false }
              - column:
                  name: status
                  type: text
                  defaultValue: NEW
                  constraints: { nullable: false }
              - column:
                  name: attempt
                  type: int
                  defaultValueNumeric: 0
                  constraints: { nullable: false }
              - column: { name: next_retry_at, type: timestamptz }
              - column: { name: last_error, type: text }
              - column:
                  name: received_at
                  type: timestamptz
                  constraints: { nullable: false }
              - column: { name: processed_at, type: timestamptz }

# Индекс под выборку «что пора разобрать» заведён отдельно (003-outbox-index), под настоящий запрос планировщика:
# только по запросу видно, какие колонки и в каком порядке индексировать. Частичный индекс создаётся сырым sql,
# потому что createIndex в Liquibase ключ where молча игнорирует.
