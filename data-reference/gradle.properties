group=ru.projectx
# Версия сервиса по Semantic Versioning 2.0.0; правила номера — в CHANGELOG.md. Её же показывает
# /actuator/info, а Dockerfile берёт по ней имя jar.
version=1.0.0-SNAPSHOT

# Версия Spring Boot нужна дважды: плагину в plugins {} и BOM'у в dependencies {}.
# Плагин объявляется до того, как build.gradle может завести переменную, поэтому
# единственное место, откуда её видно обоим, — этот файл.
springBootVersion=4.0.7

# Репозиторий русскоязычный: без явной кодировки вывод сборки нечитаем там,
# где локаль машины не UTF-8.
org.gradle.jvmargs=-Xmx1g -Dfile.encoding=UTF-8 -Dstdout.encoding=UTF-8 -Dstderr.encoding=UTF-8

org.gradle.caching=true
org.gradle.configuration-cache=true
