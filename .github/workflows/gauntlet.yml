# Gauntlet gate for pull requests. Installed to .github/workflows/gauntlet.yml by gauntlet/install.sh.
# The agent's hooks run only inside Claude Code; this job is the check nobody can skip.
name: gauntlet

on:
  pull_request:
    paths-ignore:                           # documents never change what the gates check; CI minutes are metered
      - 'docs/**'
      - 'project_files/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: gauntlet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gauntlet:
    name: gauntlet
    runs-on: ubuntu-24.04                   # pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19
    timeout-minutes: 150                    # a large change runs about 100 minutes: mutation and Gherkin mutation
    env:
      ORG_GRADLE_PROJECT_publicRepositories: "true"   # outside the corporate network: public repositories
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                      # scope=changed needs the merge base with the base branch

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve the base branch and the module
        id: base
        run: |
          base="${{ github.base_ref }}"
          if [ -z "$base" ]; then
            base=$(sed -n 's#^[[:space:]]*baseRef[[:space:]]*=[[:space:]]*origin/##p' gauntlet/config/gauntlet.properties | tail -1)
          fi
          all=$(sed -n 's#^[[:space:]]*module[[:space:]]*=[[:space:]]*##p' gauntlet/config/gauntlet.properties | tail -1 | tr ',' ' ')
          git fetch --no-tags origin "${base:-main}"
          # Only the modules the PR touches run; a change to the kit or the workflow itself runs all of them.
          changed=$(git diff --name-only "origin/${base:-main}...HEAD")
          modules=""
          if ! echo "$changed" | grep -qE '^(gauntlet/|\.github/)'; then
            for dir in $all; do
              echo "$changed" | grep -q "^$dir/" && modules="$modules $dir"
            done
          fi
          modules=${modules:-$all}
          echo "ref=origin/${base:-main}" >> "$GITHUB_OUTPUT"
          echo "modules=${modules:-.}" >> "$GITHUB_OUTPUT"
          echo "gauntlet runs in: ${modules:-.}"

      - name: Run the gauntlet in every guarded build
        run: |
          status=0
          for dir in ${{ steps.base.outputs.modules }}; do
            echo "::group::gauntlet in $dir"
            ( cd "$dir" && ./gradlew gauntlet --continue --console=plain -Pgauntlet.baseRef="${{ steps.base.outputs.ref }}" ) || status=1
            echo "::endgroup::"
          done
          exit $status

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gauntlet-reports
          path: |
            **/build/reports
            **/build/gauntlet
          if-no-files-found: ignore
